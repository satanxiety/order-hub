<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Order Hub</title>
<style>
:root{--bg:#f6f4f1;--card:#fff;--ink:#22201e;--soft:#6f6a65;--line:#e5e0da;--acc:#7c4dff;--red:#d93838;--green:#1f9d55;--amber:#d98b00;--blue:#2b6cd9}
*{box-sizing:border-box}
body{margin:0;font:14px/1.45 -apple-system,Segoe UI,Roboto,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink)}
header{position:sticky;top:0;z-index:5;background:#1f1b2e;color:#fff;padding:10px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
header h1{font-size:17px;margin:0 8px 0 0;letter-spacing:.3px}
header .sp{flex:1}
button,select,input,textarea{font:inherit}
button{cursor:pointer;border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 12px}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff}
button.sm{padding:3px 8px;font-size:12px}
.lang button{background:transparent;color:#fff;border-color:#4b4466;padding:4px 9px}
.lang button.on{background:#fff;color:#1f1b2e}
.tabs{display:flex;gap:6px;padding:10px 14px 0;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:#fff;border-radius:20px;padding:6px 14px}
.tab.on{background:#1f1b2e;color:#fff;border-color:#1f1b2e}
.tab .n{opacity:.65;margin-left:4px}
.bar{display:flex;gap:8px;padding:10px 14px;flex-wrap:wrap;align-items:center}
.bar input,.bar select{border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:#fff}
.bar input{flex:1;min-width:180px}
#list{padding:0 14px 40px;display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(360px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.card.over{border-color:var(--red);box-shadow:0 0 0 2px #d9383822}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.chip{font-size:11px;padding:2px 8px;border-radius:12px;background:#eee;white-space:nowrap}
.st{font-weight:600;color:#fff}
.st-new{background:var(--blue)}.st-ordered{background:#6b5bd2}.st-warehouse{background:var(--amber)}.st-shipped{background:var(--green)}
.st-delayed{background:#e0662b}.st-outofstock{background:var(--red)}.st-problem{background:#9b1c1c}.st-cancelled{background:#888}.st-delivered{background:#1f7a4d}
.gift{background:#ffe3ef;color:#b0105a;font-weight:600}
.due{background:#fff1d6;color:#8a5a00}.due.late{background:#ffdede;color:var(--red);font-weight:700}
.title{font-weight:650;font-size:15px}
.k{color:var(--soft);font-size:11px;text-transform:uppercase;letter-spacing:.4px}
.box{background:#faf8f6;border:1px solid var(--line);border-radius:8px;padding:8px;white-space:pre-wrap;word-break:break-word}
.links a{display:block;color:var(--blue);word-break:break-all;font-size:12px}
.ph{display:flex;gap:6px;flex-wrap:wrap}
.ph img{width:76px;height:76px;object-fit:cover;border-radius:6px;border:1px solid var(--line);cursor:zoom-in}
.agent{border-top:1px dashed var(--line);padding-top:8px;display:grid;grid-template-columns:1fr 1fr;gap:6px}
.agent input,.agent select,.agent textarea{width:100%;border:1px solid var(--line);border-radius:6px;padding:5px 7px}
.agent .full{grid-column:1/-1}
.log{font-size:11px;color:var(--soft);white-space:pre-wrap;max-height:70px;overflow:auto}
.modal{position:fixed;inset:0;background:#0007;display:none;align-items:flex-start;justify-content:center;z-index:20;overflow:auto;padding:20px 10px}
.modal.on{display:flex}
.sheet{background:#fff;border-radius:14px;max-width:760px;width:100%;padding:16px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid .full{grid-column:1/-1}
.grid label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--soft)}
.grid input,.grid textarea,.grid select{border:1px solid var(--line);border-radius:8px;padding:7px 9px;color:var(--ink)}
.paste{border:2px dashed #c9b8ff;border-radius:10px;padding:12px;text-align:center;color:var(--soft);background:#faf7ff}
.center{max-width:380px;margin:60px auto;background:#fff;border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:10px;border:1px solid var(--line)}
.center input{border:1px solid var(--line);border-radius:8px;padding:9px}
.muted{color:var(--soft);font-size:12px}
.empty{color:var(--soft);padding:30px;text-align:center}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#1f1b2e;color:#fff;padding:8px 16px;border-radius:20px;display:none;z-index:30}
#zoom{position:fixed;inset:0;background:#000c;display:none;align-items:center;justify-content:center;z-index:40}
#zoom img{max-width:95vw;max-height:92vh}
/* v5 layout */
.tabs{padding:12px 14px 0}
.tab{font-size:13px;padding:5px 12px}
.seg{display:flex;gap:6px;padding:10px 14px 0;flex-wrap:wrap}
.seg button{border-radius:10px;padding:8px 14px;font-weight:600;color:var(--soft);display:flex;align-items:center;gap:6px}
.seg button .n{min-width:22px;padding:0 7px;border-radius:10px;background:#0000000f;font-size:12px;color:var(--ink)}
.seg button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.seg button.on .n{background:#ffffff33;color:#fff}
.seg button.todo.on{background:var(--acc);border-color:var(--acc)}
.seg .dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.hint{padding:6px 14px 0;color:var(--soft);font-size:12px}
#list{grid-template-columns:repeat(auto-fill,minmax(400px,1fr))}
.card{gap:10px;border-left:5px solid var(--line)}
.card.b-new{border-left-color:var(--blue)}.card.b-ordered{border-left-color:#6b5bd2}.card.b-warehouse{border-left-color:var(--amber)}
.card.b-shipped{border-left-color:var(--green)}.card.b-delivered{border-left-color:#1f7a4d}.card.b-cancelled{border-left-color:#999;opacity:.75}
.card.b-delayed,.card.b-outofstock,.card.b-problem{border-left-color:var(--red)}
.top{display:flex;gap:12px}
.thumb{width:92px;height:92px;object-fit:cover;border-radius:10px;flex:none;background:#eee;cursor:zoom-in;border:1px solid var(--line)}
.meta{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.title{font-size:14px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sub{font-size:12px;color:var(--soft)}
.sub b{color:var(--ink)}
.lk{display:flex;gap:6px;flex-wrap:wrap}
.lk a{font-size:12px;text-decoration:none;border:1px solid var(--line);border-radius:6px;padding:2px 8px;color:var(--blue);background:#fff}
.trk{font-weight:700;color:var(--blue);text-decoration:none;border-bottom:1px dashed var(--blue)}
.lk a.l1688{color:#c2410c;border-color:#fed7aa;background:#fff7ed}
.note{background:#fff8e1;border-color:#f3dc9b}
.info{font-size:12px;color:var(--soft);white-space:pre-wrap;background:#f4f6fb;border-radius:8px;padding:6px 8px}
details{border-top:1px solid var(--line);padding-top:6px}
details>summary{cursor:pointer;font-size:12px;font-weight:600;color:var(--soft);list-style:none;user-select:none}
details>summary::before{content:'▸ ';}
details[open]>summary::before{content:'▾ ';}
details>summary b{color:var(--ink);font-weight:600}
details .agent{border-top:0;margin-top:6px;padding-top:0}
.ono{font:700 15px/1.2 ui-monospace,Consolas,monospace;background:#f1edff;color:#3b2a8f;border:1px solid #d6ccff;border-radius:8px;padding:5px 10px;letter-spacing:.3px}
.ono:hover{background:#e4dcff}
.ono .lb{font:600 10px/1 -apple-system,Segoe UI,sans-serif;color:#7a6cc4;margin-right:6px;text-transform:uppercase;letter-spacing:.5px}
.trk{font-size:14px}
#list.c1{grid-template-columns:1fr;max-width:1000px;margin:0 auto}
#list.c2{grid-template-columns:repeat(2,minmax(0,1fr))}
.view{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff}
.view button{border:0;border-radius:0;padding:6px 10px;font-size:13px;color:var(--soft)}
.view button.on{background:var(--ink);color:#fff}
.guide h2{margin:0 0 4px;font-size:20px}.guide h3{margin:16px 0 6px;font-size:15px}
.guide ol,.guide ul{margin:4px 0;padding-left:20px}.guide li{margin:3px 0}
.guide .tip{background:#f1edff;border-radius:8px;padding:8px 10px;margin-top:8px}
.guide .stt{display:inline-block;color:#fff;border-radius:10px;padding:1px 8px;font-size:12px;font-weight:600}
@media(max-width:600px){#list.c2{grid-template-columns:1fr}.view{display:none}#list{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.agent{grid-template-columns:1fr}.thumb{width:72px;height:72px}}
</style>
<script>window.onerror=function(m,s,l,c){try{var d=document.createElement('pre');d.style.cssText='color:#b00;white-space:pre-wrap;padding:8px';d.textContent='JS error: '+m+' @'+l+':'+c;(document.body||document.documentElement).appendChild(d);}catch(e){}};</script>

let SYNC_READY_SENT=false;
function syncReady(){if(SYNC_READY_SENT||S.role!=='admin'||!window.opener)return;SYNC_READY_SENT=true;try{window.opener.postMessage({type:'oh-ready'},'*');}catch(e){}}
window.addEventListener('message',async e=>{
  const d=e.data||{};if(d.type!=='oh-etsy')return;
  if(!/^https:[/][/]([a-z]+[.])?etsy[.]com$/.test(e.origin))return;
  const reply=m=>{try{e.source.postMessage(Object.assign({type:'oh-res'},m),e.origin);}catch(x){}};
  if(S.role!=='admin'){reply({error:'log in to Order Hub as admin'});return;}
  const L=d.orders||[];let c=0,u=0;
  try{
    for(let i=0;i<L.length;i+=40){const r=await api('importOrders',S.pass,L.slice(i,i+40),true);c+=r.created;u+=r.updated;toast('Etsy → '+Math.min(i+40,L.length)+'/'+L.length);}
    reply({ok:true,total:L.length,created:c,updated:u});
    await reload();
    $('#sheet').innerHTML=`<h3 style="margin:0 0 8px">✅ Etsy senkron</h3><p>${esc(L[0]&&L[0].store||'')}: <b>${L.length}</b> sipariş okundu · <b>${c}</b> yeni · <b>${u}</b> güncellendi.</p><div class="row" style="justify-content:flex-end"><button class="pri" id="sok">OK</button></div>`;
    $('#modal').classList.add('on');$('#sok').onclick=()=>$('#modal').classList.remove('on');
  }catch(err){reply({error:String(err.message||err)});alert('Etsy sync error: '+(err.message||err));}
});
function toast(m){const e=$('#toast');e.textContent=m;e.style.display='block';clearTimeout(e._t);e._t=setTimeout(()=>e.style.display='none',1800);}
function applyLang(){document.querySelectorAll('[data-t]').forEach(e=>e.textContent=t(e.dataset.t));document.querySelectorAll('.lang button').forEach(b=>b.classList.toggle('on',b.dataset.l===S.lang));}


async function boot(){
  S.lang=ls.get('oh_lang')||(navigator.language||'').slice(0,2).replace(/[^a-z]/g,'');if(!T[S.lang])S.lang='en';

function daysTo(d){if(!d)return null;const x=new Date(String(d).slice(0,10)+'T00:00:00');const n=new Date();n.setHours(0,0,0,0);return Math.round((x-n)/864e5);}
const PRI={problem:0,outofstock:1,delayed:2,new:3,ordered:4,warehouse:5,shipped:8,delivered:9,cancelled:10};
const TODO=['new','warehouse','delayed','outofstock','problem'];
const SEG=[['todo',null],['ordered','#6b5bd2'],['shippedDs','#e0662b'],['shipped','#1f9d55'],['delivered','#1f7a4d'],['cancelled','#999'],['*',null]];
const etsyShip=o=>String(o.etsyShipped)==='true'||/^Etsy: shipped/m.test(String(o.agentNote||''));
const inSeg=(o,f)=>f==='*'?true:f==='todo'?TODO.includes(o.status||'new'):f==='shipped'?o.status==='shipped'&&etsyShip(o):f==='shippedDs'?o.status==='shipped'&&!etsyShip(o):o.status===f;
const IMG='image'+'/'+'*';
const T17='https:'+'/'.repeat(2)+'t.17track.net/en#nums=';
function filtered(){
  let L=S.orders.filter(o=>S.tab==='*'||o.store===S.tab);
  L=L.filter(o=>inSeg(o,S.fs));
  const q=S.q.trim().toLowerCase();
  if(q)L=L.filter(o=>['id','etsyOrderId','productName','buyerName','address','tracking','variant','country'].some(k=>String(o[k]||'').toLowerCase().includes(q)));
  const sd=o=>{const d=daysTo(o.shipBy);return d==null?999:d;};
  if(S.sort==='queue')L.sort((a,b)=>(PRI[a.status]??5)-(PRI[b.status]??5)||sd(a)-sd(b));
  else if(S.sort==='ship')L.sort((a,b)=>sd(a)-sd(b));
  else L.sort((a,b)=>String(b.created).localeCompare(String(a.created)));
  return L;
}
async function tr(texts){
  const need=[...new Set(texts.filter(x=>x&&!S.trCache[S.lang+'|'+x]))];
  if(need.length){try{const out=await api('translate',S.pass,need,S.lang==='zh'?'zh-CN':S.lang);need.forEach((x,i)=>S.trCache[S.lang+'|'+x]=out[i]);}catch(e){}}
}
const TX=s=>S.tr&&s?(S.trCache[S.lang+'|'+s]||s):s;

function photoStrip(v){return String(v||'').split('\n').filter(Boolean).map(u=>`<img src="${esc(u)}" data-z="${esc(u)}">`).join('');}
function card(o){
  const d=daysTo(o.shipBy);const late=d!=null&&d<0&&!['shipped','delivered','cancelled'].includes(o.status);
  const due=o.shipBy&&!['shipped','delivered','cancelled'].includes(o.status)?`<span class="chip due ${late||d===0?'late':''}">📅 ${esc(String(o.shipBy).slice(0,10))} · ${late?t('late'):d===0?t('today'):d+' '+t('daysLeft')}</span>`:'';
  const gift=String(o.gift)==='true'?`<span class="chip gift">🎁 ${t('gift')}</span>`:'';
  const L1688=String(o.links1688||'').split('\n').filter(Boolean);

  const trkLine=o.tracking?`🚚 ${String(o.tracking).split(/[\s,]+/).filter(Boolean).map(n=>`<a class="trk" href="${T17+encodeURIComponent(n)}" target="_blank" title="${t('track17')}">${esc(n)} ↗</a> <button class="sm" data-copy="${esc(n)}">${t('copy')}</button>`).join(' ')}${o.carrier?' · '+esc(o.carrier):''}${o.status==='shipped'&&!etsyShip(o)?` <span class="chip" style="background:#fde7dc;color:#b4441b;font-weight:600">⚠ ${t('notOnEtsy')}</span>`:''}`:'';
  return `<div class="card b-${esc(o.status||'new')} ${late?'over':''}" data-id="${esc(o.id)}">

    <div class="meta">
     <div class="row"><span class="chip st st-${esc(o.status)}">${t('st_'+o.status)}</span>${due}${gift}<span style="flex:1"></span><span class="sub">${odS?t('ordDate')+' '+esc(odS):''}</span></div>
     <div class="title"><b>${esc(TX(o.productName))||'—'}</b></div>
     <div class="sub">${o.variant?`<b>${esc(TX(o.variant))}</b> · `:''}${t('qty')} <b>${esc(o.qty)}</b> · ${esc(o.store)}${o.country?` · ${esc(o.country)}`:''}</div>
     ${o.etsyOrderId?`<div><button class="ono" data-copy="${esc(o.etsyOrderId)}" title="${t('copyOrderNo')}"><span class="lb">${t('orderNo')}</span>${esc(o.etsyOrderId)} 📋</button></div>`:''}
     <div class="lk">${etsyL}${links}</div>
    </div>
   </div>
   ${trkLine?`<div class="sub">${trkLine}</div>`:''}

   ${o.agentNote?`<div class="info">${esc(TX(o.agentNote))}</div>`:''}
   <details ${todo?'open':''}><summary>📍 ${t('addrBlock')}</summary>
    <div style="margin-top:6px"><div class="row"><span class="k">${t('address')}</span><button class="sm" data-copy="${esc((o.buyerName&&!String(o.address).startsWith(o.buyerName)?o.buyerName+'\n':'')+o.address)}">${t('copy')}</button></div><div class="box">${esc(o.buyerName&&!String(o.address).startsWith(o.buyerName)?o.buyerName+'\n':'')}${esc(o.address)}</div></div>

   </div>`;
}
function bindCards(){

    const up=c.querySelector('[data-up]');up.onchange=async()=>{const urls=await uploadFiles(up.files);if(urls.length){await saveOrder({id:o.id,agentPhotos:[o.agentPhotos,...urls].filter(Boolean).join('\n')});}};

async function saveOrder(u){
  try{await api('saveOrder',S.pass,u);toast(t('saved'));await reload();}catch(e){alert(e.message||e);}
}


function shrink(file){return new Promise(res=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const m=1600,k=Math.min(1,m/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',0.85).split(',')[1]);};im.src=r.result;};r.readAsDataURL(file);});}
async function uploadFiles(files){const out=[];for(const f of [...files]){toast('⬆️ '+(f.name||'photo'));const b=await shrink(f);out.push(await api('uploadPhoto',S.pass,b,'image/jpeg',(f.name||'paste')+'.jpg'));}return out;}

  <div class="grid" style="margin-top:10px">
   <label>${t('store')}<select data-k="store">${S.stores.map(s=>`<option ${o.store===s?'selected':''}>${esc(s)}</option>`).join('')}</select></label>

   <label>${t('gift')}<select data-k="gift"><option value="false">—</option><option value="true" ${String(o.gift)==='true'?'selected':''}>🎁 ${t('gift')}</option></select></label>
   ${f('giftNote','area',true)}${f('special','area',true)}
   <label class="full">${t('photos')}<input type="file" accept="${IMG}" multiple id="pf"><div class="ph" id="pp">${photoStrip(o.photos)}</div></label>
  </div>
  <div class="row" style="margin-top:12px;justify-content:flex-end"><button id="cx">${t('cancel')}</button><button class="pri" id="sv">${t('save')}</button></div>`;
  let photos=String(o.photos||'').split('\n').filter(Boolean);
  const redraw=()=>$('#pp').innerHTML=photoStrip(photos.join('\n'));
  const addFiles=async fs=>{const u=await uploadFiles(fs);photos=photos.concat(u);redraw();};

  $('#sheet').addEventListener('paste',pasteImg);
  $('#pt').oninput=e=>{const s=e.target.value;
    const ioss=(s.match(/\bIM\d{10}\b/)||[])[0];const vat=(s.match(/\b(GB|EU|NO|CH|AU|NZ)?\s?VAT[^\d]{0,12}(\d[\d ]{6,})/i)||[])[2];
    const val=(s.match(/[€£$]\s?\d+[.,]\d{2}/)||[])[0];
    const set=(k,v)=>{const el=document.querySelector(`[data-k="${k}"]`);if(el&&v&&!el.value)el.value=v;};
    set('taxCode',ioss?'IOSS '+ioss:(vat?'VAT '+vat.trim():''));set('orderValue',val);
    const lines=s.split('\n').map(x=>x.trim()).filter(Boolean);
    if(!ioss&&lines.length>=2&&lines.length<=7&&!document.querySelector('[data-k="address"]').value){document.querySelector('[data-k="address"]').value=lines.join('\n');set('country',lines[lines.length-1]);}
  };
  $('#cx').onclick=()=>$('#modal').classList.remove('on');
  $('#sv').onclick=async()=>{const u={id:o.id};document.querySelectorAll('#sheet [data-k]').forEach(e=>u[e.dataset.k]=e.value);u.photos=photos.join('\n');$('#sv').disabled=true;await saveOrder(u);$('#modal').classList.remove('on');};
  $('#modal').classList.add('on');
}
const GUIDE={
en:`<h2>👋 Welcome, Ivy!</h2><p>This is our order board. Every order from our Etsy shops is here, so you don’t need WhatsApp screenshots any more. Please check it <b>every morning</b>.</p>
<h3>1. Log in &amp; language</h3><ul><li>Open the link, type your password once (it is remembered on this device).</li><li>Language: <b>中文</b> button at the top right. Tick <b>Translate content</b> to translate product names and notes too.</li></ul>
<h3>2. Which orders to work on</h3><ul><li>The site opens on <b>⚡ To do</b>, newest order first. These are the orders that need you.</li><li>Other lists are behind the buttons: <b>Ordered on 1688</b>, <b>Shipped</b>, <b>Delivered</b>, <b>Cancelled</b>, <b>All</b>.</li><li>Store tabs (Novelle, Lumiva, MiniBoutique) filter by shop. Search box: name, order no, tracking.</li><li>☰ <b>List</b> / ▦ <b>2 columns</b> (right side) changes the layout.</li></ul>
<h3>3. Reading an order card</h3><ul><li>Photo, product name, <b>color / size</b>, quantity, country.</li><li><b>Order no</b> (purple box): click to copy.</li><li><b>1688 ↗</b>: the supplier link to buy from. <b>Etsy ↗</b>: our listing.</li><li>📅 <b>ship-by date</b>: red = late. 🎁 = gift order (no price inside the parcel!). 📝 yellow box = special request from the customer.</li><li><b>📍 Address · tax · value</b>: shipping address (Copy button), tax code (IOSS for EU — copy it to the customs form) and the order value for customs.</li></ul>
<h3>4. Updating an order</h3><ol><li>Open <b>✏️ Update status / tracking / cost</b> on the card.</li><li>Choose the status:<br>
<span class="stt" style="background:#6b5bd2">Ordered on 1688</span> after you buy it · <span class="stt" style="background:#d98b00">In warehouse</span> when it arrives (add photos!) · <span class="stt" style="background:#1f9d55">Shipped</span> when sent (tracking number + carrier) · <span class="stt" style="background:#e0662b">Delayed</span> / <span class="stt" style="background:#d93838">Out of stock</span> / <span class="stt" style="background:#9b1c1c">Problem</span> + write why in the note.</li>
<li>Enter <b>product cost</b> and <b>shipping cost</b> (choose the currency, usually CNY).</li><li><b>Agent photos</b>: upload a photo of the real item / package — very helpful for quality check.</li><li>Press <b>Save</b>. ✅ "Saved" appears and the card moves to the right list.</li></ol>
<h3>5. Tracking</h3><ul><li>Click a tracking number → it opens <b>17track</b> with the parcel location. The Copy button next to it copies the number.</li></ul>
<div class="tip">💡 Only <b>status, tracking, carrier, costs, note and photos</b> can be changed by you — the order details come from Etsy. If something is wrong or unclear, write it in the <b>Agent note</b> and set status to <b>Problem</b>. Thank you! 🙏</div>`,
zh:`<h2>👋 欢迎你，Ivy！</h2><p>这是我们的订单看板。我们Etsy店铺的所有订单都在这里，不用再发WhatsApp截图了。请<b>每天早上</b>查看一次。</p>
<h3>1. 登录和语言</h3><ul><li>打开链接，输入一次密码（这台设备会记住）。</li><li>右上角点 <b>中文</b> 切换语言。勾选 <b>翻译内容</b> 可以把产品名称和备注也翻译成中文。</li></ul>
<h3>2. 先处理哪些订单</h3><ul><li>打开后默认是 <b>⚡ 待处理</b>，最新的订单在最上面。这些就是需要你处理的订单。</li><li>其他列表在上方按钮里：<b>已在1688下单</b>、<b>已发货</b>、<b>已签收</b>、<b>已取消</b>、<b>全部</b>。</li><li>店铺标签（Novelle、Lumiva、MiniBoutique）按店铺筛选。搜索框可搜姓名、订单号、快递单号。</li><li>右侧 ☰ <b>单列</b> / ▦ <b>双列</b> 可以切换排列方式。</li></ul>
<h3>3. 怎么看订单卡片</h3><ul><li>图片、产品名称、<b>颜色 / 尺码</b>、数量、国家。</li><li><b>订单号</b>（紫色框）：点击即可复制。</li><li><b>1688 ↗</b>：采购链接。<b>Etsy ↗</b>：我们的商品页面。</li><li>📅 <b>最晚发货日期</b>：红色 = 已逾期。🎁 = 礼物订单（包裹里不要放价格！）。📝 黄色框 = 客户的特殊要求。</li><li><b>📍 地址 · 税号 · 价值</b>：收货地址（复制按钮）、税号（欧盟订单是IOSS，请填到报关单上）和申报价值。</li></ul>
<h3>4. 更新订单</h3><ol><li>在卡片上打开 <b>✏️ 更新状态 / 快递 / 成本</b>。</li><li>选择状态：<br>
<span class="stt" style="background:#6b5bd2">已在1688下单</span> 下单后 · <span class="stt" style="background:#d98b00">已到仓</span> 到货后（请上传照片！）· <span class="stt" style="background:#1f9d55">已发货</span> 发出后（填快递单号和快递公司）· <span class="stt" style="background:#e0662b">延迟</span> / <span class="stt" style="background:#d93838">缺货</span> / <span class="stt" style="background:#9b1c1c">有问题</span> 请在备注里写原因。</li>
<li>填写 <b>产品成本</b> 和 <b>运费</b>（选择币种，一般是CNY）。</li><li><b>代理图片</b>：上传实物 / 包裹照片，方便我们检查质量。</li><li>点击 <b>保存</b>。出现 ✅ "已保存"，订单会自动移到对应的列表。</li></ol>
<h3>5. 物流查询</h3><ul><li>点击快递单号 → 自动打开 <b>17track</b> 显示包裹位置。旁边的复制按钮可以复制单号。</li></ul>
<div class="tip">💡 你只能修改 <b>状态、快递单号、快递公司、成本、备注和照片</b>，订单信息来自Etsy。如果有问题或不清楚，请写在 <b>代理备注</b> 里并把状态设为 <b>有问题</b>。谢谢！🙏</div>`,
tr:`<h2>👋 Order Hub rehberi</h2><p>Etsy mağazalarımızın bütün siparişleri burada. Ivy her sabah bakıyor ve güncelliyor; sen de aynı ekrandan takip ediyorsun.</p>
<h3>1. Hangi siparişler görünür</h3><ul><li>Site <b>⚡ Yapılacak</b> sekmesiyle, en yeni sipariş en üstte açılır (yeni, depoda, gecikme, stok yok, sorun).</li><li>Diğerleri üstteki butonlarda: <b>Sipariş verildi</b>, <b>Kargoda · Etsy’ye girilmedi</b> (takip var, Etsy’de shipped değil), <b>Kargoda · Etsy’de ✓</b>, <b>Teslim</b>, <b>İptal</b>, <b>Hepsi</b>.</li><li>Sağdaki ☰ <b>Alt alta</b> / ▦ <b>Yan yana 2</b> ile görünümü seç (hatırlanır).</li></ul>
<h3>2. Kart</h3><ul><li><b>Sipariş no</b> (mor kutu) ve <b>takip no</b>: tıkla/kopyala. Takip no’ya tıklayınca 17track açılır.</li><li><b>1688 ↗</b> tedarikçi, <b>Etsy ↗</b> ilan. 📍 bölümünde adres, IOSS/VAT ve gümrük değeri.</li></ul>
<h3>3. Admin</h3><ul><li><b>+ Yeni sipariş</b> elle ekleme, <b>⇩ Etsy import</b> toplu senkron (adımlar README’de), <b>Düzenle / Arşivle</b> kartta.</li></ul>`
};
function showGuide(){
  const g=GUIDE[S.lang]||GUIDE.en;
  $('#sheet').innerHTML=`<div class="guide">${g}</div><div class="row" style="margin-top:14px;justify-content:flex-end"><button class="pri" id="gok">OK 👍</button></div>`;
  $('#modal').classList.add('on');$('#gok').onclick=()=>$('#modal').classList.remove('on');
}
boot();
</script>
